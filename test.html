<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lab Security Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: center;
    }

    button {
      display: block;
      margin: 20px auto;
      width: 80%;
      max-width: 400px;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #camera,
    #canvas,
    #photo {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.6;
    }

    .notice {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>🔐 Lab Security Test</h2>

  <p class="notice">
    Continue করলে camera এবং location permission চাওয়া হবে।
  </p>

  <button id="takePhotoBtn" onclick="startTest()">
    📷 Continue
  </button>

  <p id="status"></p>

  <video id="camera" autoplay playsinline></video>

  <canvas id="canvas"></canvas>

  <img id="photo" alt="Captured photo">

</div>

<script>

async function startTest() {

  const button = document.getElementById("takePhotoBtn");
  const status = document.getElementById("status");
  const video = document.getElementById("camera");
  const canvas = document.getElementById("canvas");

  button.disabled = true;

  try {

    /*
     * প্রথমে camera permission
     */

    status.innerText =
      "📷 Camera permission চাওয়া হচ্ছে...";

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "এই browser-এ camera access available নয়।"
      );
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    video.srcObject = stream;

    await video.play();

    /*
     * Camera থেকে একটি frame capture
     */

    await new Promise(function(resolve) {
      setTimeout(resolve, 500);
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const capturedPhoto =
      canvas.toDataURL("image/jpeg", 0.85);

    /*
     * Camera বন্ধ
     */

    stream.getTracks().forEach(function(track) {
      track.stop();
    });

    video.srcObject = null;

    /*
     * এখন Location permission
     */

    status.innerText =
      "📍 Location permission চাওয়া হচ্ছে...";

    if (!navigator.geolocation) {
      throw new Error(
        "এই browser-এ location available নয়।"
      );
    }

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;

        console.log("Latitude:", latitude);
        console.log("Longitude:", longitude);
        console.log("Accuracy:", accuracy);

        status.innerText =
          "✅ Camera এবং location permission সফল হয়েছে।";

        button.style.display = "none";

        /*
         * গুরুত্বপূর্ণ:
         * Photo এবং location এখানে শুধু browser-এর
         * JavaScript-এর মধ্যে আছে।
         *
         * কোনো server-এ পাঠানো হচ্ছে না।
         */

        console.log({
          photo: capturedPhoto,
          latitude: latitude,
          longitude: longitude,
          accuracy: accuracy
        });

      },

      function(error) {

        button.disabled = false;

        if (error.code === 1) {
          status.innerText =
            "❌ Location permission দেওয়া হয়নি।";
        } else if (error.code === 2) {
          status.innerText =
            "❌ Location পাওয়া যায়নি।";
        } else {
          status.innerText =
            "❌ Location নেওয়া যায়নি।";
        }

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  } catch (error) {

    console.error(error);

    button.disabled = false;

    status.innerText =
      "❌ " + error.message;

  }

}

</script>

</body>
</html>
