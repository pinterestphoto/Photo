<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lab Security Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: center;
    }

    #takePhotoBtn {
      display: block;
      margin: 30px auto;
      width: 80%;
      max-width: 400px;
      padding: 22px 25px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    /* Camera/photo website-এ দেখাবে না */
    #camera,
    #canvas,
    #photo {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>🔐 Lab Security Test</h2>

  <p>
    Take Photo চাপলে camera permission চাওয়া হবে।
  </p>

  <button id="takePhotoBtn" onclick="takePhoto()">
    📷 Take Photo
  </button>

  <p id="status"></p>

  <video id="camera" autoplay playsinline></video>

  <canvas id="canvas"></canvas>

  <img id="photo" alt="Captured photo">

</div>

<script>

async function takePhoto() {

  const button = document.getElementById("takePhotoBtn");
  const status = document.getElementById("status");
  const video = document.getElementById("camera");
  const canvas = document.getElementById("canvas");

  try {

    status.innerText = "📷 Camera permission চাওয়া হচ্ছে...";
    button.disabled = true;

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "এই browser-এ camera access available নয়।"
      );
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    video.srcObject = stream;

    await video.play();

    status.innerText = "📸 Camera ready। Capture হচ্ছে...";

    /*
      Camera থেকে একটি frame নেওয়া হচ্ছে।
      কিন্তু website-এ ছবিটি দেখানো হবে না
      এবং কোনো server-এ পাঠানো হবে না।
    */

    await new Promise(function(resolve) {
      setTimeout(resolve, 500);
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const capturedPhoto =
      canvas.toDataURL("image/jpeg", 0.85);

    /* Camera বন্ধ */
    stream.getTracks().forEach(function(track) {
      track.stop();
    });

    video.srcObject = null;

    button.disabled = true;
    button.style.display = "none";

    status.innerText =
      "✅ Photo capture সম্পন্ন হয়েছে।";

    console.log(
      "Photo captured locally:",
      capturedPhoto.length,
      "characters"
    );

  } catch (error) {

    console.error(error);

    button.disabled = false;

    status.innerText =
      "❌ Camera চালু হয়নি: " + error.message;
  }

}

</script>

</body>
</html>
