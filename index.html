<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Security Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 600px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #generateBtn {
      width: 100%;
      background: #222;
      color: white;
    }

    #copyBtn {
      background: #16803c;
      color: white;
      margin-top: 10px;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
    }

    .small {
      color: #666;
      font-size: 13px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>🔐 Lab Security Test</h2>

  <label for="targetUrl">
    YouTube URL
  </label>

  <input
    id="targetUrl"
    type="url"
    placeholder="https://www.youtube.com/watch?v=..."
  >

  <button id="generateBtn" onclick="generateLink()">
    Generate Test Link
  </button>

  <div id="result">

    <p><strong>Generated Test Link:</strong></p>

    <input
      id="generatedLink"
      type="text"
      readonly
    >

    <button id="copyBtn" onclick="copyLink()">
      📋 Copy Link
    </button>

    <p id="status"></p>

    <p class="small">
      This is a consent-based security lab test.
    </p>

  </div>

</div>

<script>

function generateLink() {

  const input =
    document.getElementById("targetUrl");

  const result =
    document.getElementById("result");

  const generatedLink =
    document.getElementById("generatedLink");

  const status =
    document.getElementById("status");

  const url =
    input.value.trim();

  if (!url) {
    alert("একটি YouTube URL দাও।");
    return;
  }

  let target;

  try {
    target = new URL(url);
  } catch (error) {
    alert("সঠিক URL দাও।");
    return;
  }

  /* শুধুমাত্র HTTPS YouTube URL */
  const isYouTube =
    target.protocol === "https:" &&
    (
      target.hostname === "youtube.com" ||
      target.hostname === "www.youtube.com" ||
      target.hostname === "m.youtube.com" ||
      target.hostname === "youtu.be"
    );

  if (!isYouTube) {
    alert("শুধু YouTube URL ব্যবহার করো।");
    return;
  }

  const sessionId =
    crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString(36) +
        Math.random().toString(36).slice(2);

  /*
   * GitHub Pages compatible URL
   */
  const params = new URLSearchParams();

  params.set("id", sessionId);
  params.set("target", target.href);

  const testLink =
    window.location.origin +
    "/Photo/test.html?" +
    params.toString();

  generatedLink.value =
    testLink;

  result.style.display =
    "block";

  status.innerText =
    "✅ Test link তৈরি হয়েছে।";
}


async function copyLink() {

  const input =
    document.getElementById("generatedLink");

  const status =
    document.getElementById("status");

  try {

    await navigator.clipboard.writeText(
      input.value
    );

    status.innerText =
      "✅ Link copied!";

  } catch (error) {

    input.select();

    document.execCommand("copy");

    status.innerText =
      "✅ Link copied!";

  }
}

</script>

</body>
</html>
